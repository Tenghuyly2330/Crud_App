services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crud_backend
    ports:
      - "6000:6000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6000/health"]
      interval: 10s  
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crud_frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
