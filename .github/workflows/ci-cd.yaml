name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # test and build
  test:
    name: Test & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # push docker image
  docker:
    name: Publish to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Docker Hub Username
        id: user
        run: |
          CLEAN_USER=$(printf '%s' "${{ secrets.DOCKERHUB_USERNAME }}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          echo "username=$CLEAN_USER" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.user.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # backend image
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.user.outputs.username }}/crud-backend:latest
            ${{ steps.user.outputs.username }}/crud-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # frontend image
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.user.outputs.username }}/crud-frontend:latest
            ${{ steps.user.outputs.username }}/crud-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # deploy
  deploy:
    name: Continuous Deployment (CD)
    needs: [test, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend to Render
        run: |
          echo "Deploying backend to Render..."
          curl -sS --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"